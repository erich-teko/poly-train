info:
  name: user login
  type: http
  seq: 2

http:
  method: POST
  url: http://{{host}}:{{port}}/auth/login
  body:
    type: json
    data: |-
      {
        "email": "hans.wurst@xyz.abc",
        "password": "12345"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Save to a variable for use in later requests
        bru.setEnvVar("token", res.body.token);
        bru.setEnvVar("userId", res.body.userId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: user update avatar style
  type: http
  seq: 8

http:
  method: PUT
  url: http://{{host}}:{{port}}/api/user/avatar-style
  body:
    type: json
    data: |-
      {
        "avatarStyle": "sprouts"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

info:
  name: user login
  type: http
  seq: 3

http:
  method: POST
  url: http://{{host}}:{{port}}/auth/login
  body:
    type: json
    data: |-
      {
        "email": "hans.wurst@xyz.abc",
        "password": "12345"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Save to a variable for use in later requests
        bru.setVar("token", res.body.token);
        bru.setVar("userId", res.body.userId);
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: ""
        method: jsonq
      variable:
        name: ""
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

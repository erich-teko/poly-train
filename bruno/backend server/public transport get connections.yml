info:
  name: public transport connections
  type: http
  seq: 12

http:
  method: GET
  url: http://{{host}}:{{port}}/public-transport/connections?startStation=Luzern&endStation=Stans&travelDate=2026-07-30&travelTime=08:00&isArrivalTime=1
  params:
    - name: startStation
      value: Luzern
      type: query
    - name: endStation
      value: Stans
      type: query
    - name: travelDate
      value: 2026-07-30
      type: query
    - name: travelTime
      value: 08:00
      type: query
    - name: isArrivalTime
      value: "1"
      type: query
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: ""
        method: jsonq
      variable:
        name: ""
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
